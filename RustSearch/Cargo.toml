[package]
name = "rustsearch"
version = "0.1.0"
edition = "2026"
description = "Un buscador de archivos ultrarrápido para Windows, inspirado en Everything y escrito en Rust."
license = "MIT"
repository = "https://github.com/SoyMaanuel/RustSearch"
keywords = ["search", "file", "indexer", "windows", "everything"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Manuel Hernandez <soymaanuel20@gmail.com>"]

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
egui_extras = "0.33.3"
jwalk = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
dirs = "5.0"
open = "5.3.2"
trash = "5.2.0"
runas = "1.2.0"
image = { version = "0.25", default-features = false, features = ["ico"] }

window-vibrancy = "0.6.0"
raw-window-handle = "0.6.0"
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_System_Diagnostics_Debug"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
ico = "0.6.0"
